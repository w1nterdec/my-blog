backend:
  name: github
  repo: w1nterdec/my-blog-content
  branch: main
  base_url: https://chenzhixing.bbroot.com
  auth_endpoint: api/admin/auth
  squash_merges: true
locale: zh_Hans
publish_mode: editorial_workflow
site_url: https://chenzhixing.bbroot.com
display_url: https://chenzhixing.bbroot.com
logo_url: /favicon.svg
media_folder: media
public_folder: /media
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"
editor:
  preview: true
collections:
  - name: posts
    label: 文章
    folder: posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields:
      - pubDatetime
      - title
    fields:
      - name: title
        label: 标题
        widget: string
      - name: description
        label: 摘要
        widget: text
      - name: pubDatetime
        label: 发布时间（可设未来，按时区显示）
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
      - name: author
        label: 作者
        widget: string
        required: false
      - name: tags
        label: 标签
        widget: list
        default:
          - 随笔
      - name: featured
        label: 置顶 / 精选
        widget: boolean
        default: false
      - name: draft
        label: 暂不公开 / 撤回
        widget: boolean
        default: false
        required: false
      - name: ogImage
        label: 封面
        widget: image
        required: false
        media_library:
          config:
            multiple: false
      - name: body
        label: 正文（可视化 / Markdown，支持穿插图片）
        widget: markdown
  - name: projects
    label: 项目文档
    label_singular: 项目文档
    folder: projects
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [title, pubDatetime]
    fields:
      - name: title
        label: 项目标题
        widget: string
      - name: description
        label: 摘要
        widget: text
        required: false
      - name: pubDatetime
        label: 发布时间（可选）
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        required: false
      - name: draft
        label: 暂不公开 / 撤回
        widget: boolean
        default: false
        required: false
      - name: ogImage
        label: 分享封面（可选）
        widget: image
        required: false
      - name: body
        label: 项目正文
        widget: markdown-file
        hint: 可导入 README.md、.md 或 .markdown 文件，也可直接编辑。标题和摘要请在上方填写。
  - name: journal
    label: 个人资料与足迹
    files:
      - name: journal
        label: 个人资料与足迹
        file: settings/journal.json
        format: json
        fields:
          - name: personal
            label: 个人资料
            widget: object
            fields:
              - name: name
                label: 名字
                widget: string
              - name: signature
                label: 签名
                widget: string
              - name: avatar
                label: 头像
                widget: image
                required: true
                media_library:
                  config:
                    multiple: false
          - name: places
            label: 旅行足迹
            widget: list
            fields:
              - name: name
                label: 城市
                widget: string
              - name: coordinates
                label: 经度、纬度
                widget: list
                allow_add: false
                min: 2
                max: 2
                field:
                  name: coordinate
                  label: 坐标
                  widget: number
                  value_type: float
              - name: residence
                label: 居住状态
                widget: select
                options:
                  - 现居
                  - 曾居
                required: false
              - name: visited
                label: 曾到访
                widget: boolean
                default: true
              - name: description
                label: 城市故事
                widget: text
            summary: "{{fields.name}}"
