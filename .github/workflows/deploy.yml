name: Validate Astro source
on:
  push:
    branches: [main, codex/annual-2026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASTRO_TELEMETRY_DISABLED: "1"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && node --test tests/*.test.mjs
      - run: npm run build
# Publication is owned by the PRIVATE content repository workflow. It checks
# the latest source hourly as well as reacting to each content publication.
